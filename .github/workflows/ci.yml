name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BPY_VERSION: "5.2.2"      # Blender 5.2.2 LTS as a Python module (headless)
  GODOT_VERSION: "4.7.2"

jobs:
  lint:
    name: Lint & validate committed data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Byte-compile Python sources
        run: python -m py_compile blender/*.py blender/xianxia/*.py tools/*.py tools/maps/*.py tools/story/*.py
      - name: Validate committed GLB assets
        run: python tools/validate_glb.py godot/assets
      - name: World spec export is up to date
        run: python tools/world_spec.py --check
      - name: Generated map layouts are up to date
        run: |
          python tools/build_maps.py
          git diff --exit-code -- godot/scenes/maps
      - name: Story compiles, validates and is up to date
        run: python tools/build_story.py --check
      - name: Every voice line is synthesised and current
        run: python tools/gen_voices.py --check

  blender-build:
    name: Build assets with headless Blender (bpy 5.2.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - name: System libraries for the bpy wheel
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libxrender1 libxfixes3 libxi6 libxkbcommon0 libxext6 libsm6 libgl1 libegl1
      - name: Install Blender (bpy)
        run: pip install "bpy==${BPY_VERSION}"
      - name: Build every character, creature and environment GLB
        run: python blender/build_assets.py --out build/assets
      - name: Validate freshly built GLBs
        run: python tools/validate_glb.py build/assets | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: xianxia-glb-assets
          path: build/assets
          retention-days: 14

  godot-smoke-test:
    name: Godot 4.7.2 smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
      - name: Import project
        run: ~/godot/godot --headless --path godot --import
      - name: Run smoke test
        run: |
          set -o pipefail
          ~/godot/godot --headless --path godot -s res://tests/smoke_test.gd | tee smoke.log
      - name: Summary
        if: always()
        run: |
          echo '### Godot smoke test' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat smoke.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # The 2000-quest saga is played headlessly in twenty parallel shards, two per
  # volume. Each shard starts with the realm, minor stage and rewards of every
  # earlier quest applied, and checks the cultivation it ends with.
  godot-walkthrough:
    name: Walkthrough · Volume ${{ matrix.volume }}.${{ matrix.part }} (quests ${{ matrix.first }}-${{ matrix.last }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {volume: 1, part: 1, first: 1, last: 100}
          - {volume: 1, part: 2, first: 101, last: 200}
          - {volume: 2, part: 1, first: 201, last: 300}
          - {volume: 2, part: 2, first: 301, last: 400}
          - {volume: 3, part: 1, first: 401, last: 500}
          - {volume: 3, part: 2, first: 501, last: 600}
          - {volume: 4, part: 1, first: 601, last: 700}
          - {volume: 4, part: 2, first: 701, last: 800}
          - {volume: 5, part: 1, first: 801, last: 900}
          - {volume: 5, part: 2, first: 901, last: 1000}
          - {volume: 6, part: 1, first: 1001, last: 1100}
          - {volume: 6, part: 2, first: 1101, last: 1200}
          - {volume: 7, part: 1, first: 1201, last: 1300}
          - {volume: 7, part: 2, first: 1301, last: 1400}
          - {volume: 8, part: 1, first: 1401, last: 1500}
          - {volume: 8, part: 2, first: 1501, last: 1600}
          - {volume: 9, part: 1, first: 1601, last: 1700}
          - {volume: 9, part: 2, first: 1701, last: 1800}
          - {volume: 10, part: 1, first: 1801, last: 1900}
          - {volume: 10, part: 2, first: 1901, last: 2000}
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
      - name: Import project
        run: ~/godot/godot --headless --path godot --import
      - name: Play quests ${{ matrix.first }}-${{ matrix.last }} headlessly
        run: |
          set -o pipefail
          ~/godot/godot --headless --path godot -s res://tests/walkthrough_test.gd -- ${{ matrix.first }} ${{ matrix.last }} | tee walkthrough.log
      - name: Summary
        if: always()
        run: |
          echo '### Walkthrough, volume ${{ matrix.volume }} (quests ${{ matrix.first }}-${{ matrix.last }})' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 25 walkthrough.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  screenshots:
    name: In-engine screenshots (lavapipe)
    needs: godot-smoke-test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Software Vulkan + virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers xvfb libgl1 libegl1
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
      - name: Import project
        run: ~/godot/godot --headless --path godot --import
      - name: Capture screenshots
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            ~/godot/godot --path godot --rendering-driver vulkan --resolution 1280x720 \
            -s res://tests/capture_screenshots.gd -- "$PWD/build/screenshots"
          ls -la build/screenshots
          test "$(ls build/screenshots/*.png | wc -l)" -ge 12
      - uses: actions/upload-artifact@v4
        with:
          name: godot-screenshots
          path: build/screenshots
          retention-days: 14
